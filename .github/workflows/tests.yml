name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: self-hosted
    steps:
      - name: Check URL status
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://www.nrk.no)
          echo "URL Status Code: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: URL returned status code $STATUS"
          fi
